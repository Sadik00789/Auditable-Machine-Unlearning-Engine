name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gateway:
    name: Rust Gateway (Test & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust_gateway -> rust_gateway/target"

      - name: Fetch Dependencies & Patch Recursion Limit
        run: |
          cargo fetch
          # lance-0.17.0 async blocks exceed rustc's default recursion limit (128) during layout computation
          find ~/.cargo/registry/src -path "*/lance-0.17.0/src/lib.rs" -exec sed -i '1i #![recursion_limit = "512"]' {} +
        working-directory: rust_gateway

      - name: Cargo Check
        run: cargo check --verbose -j 2
        working-directory: rust_gateway

      - name: Cargo Test
        run: cargo test --verbose -j 2
        working-directory: rust_gateway

  ml-worker:
    name: Python ML Worker (Test & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml_worker/requirements.txt

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
        working-directory: ml_worker

      - name: Run Pytest
        run: python -m pytest -v tests/
        working-directory: ml_worker

  frontend:
    name: Next.js Frontend (TypeCheck, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        working-directory: frontend

      - name: TypeScript Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run Vitest Suite
        run: npm test
        working-directory: frontend

      - name: Production Build
        run: npm run build
        working-directory: frontend
